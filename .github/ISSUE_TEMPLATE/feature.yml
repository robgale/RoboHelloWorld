name: Feature request
description: Propose a spec-driven change
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and desired outcome
      description: Explain the user need and success criteria.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable behavior.
    validations:
      required: true
